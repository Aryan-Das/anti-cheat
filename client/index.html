<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="canvas"></canvas>


    <script>
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        canvas.width = 1280;
        canvas.height = 720;
        let playerId = null;
        let sequenceNumber = 0;
        const ws = new WebSocket("ws://localhost:8080");
        const keysHeld = {
            'KeyS': false,
            'KeyW': false,
            'KeyA': false,
            'KeyD': false
        };

        document.addEventListener('keydown', (event) => {
            keysHeld[event.code] = true;
        });

        document.addEventListener('keyup', (event) => {
            keysHeld[event.code] = false;
        });

        ws.addEventListener("open", () => {
            console.log("open");

        });
        ws.addEventListener("close", ()=> {
            console.log("close");
        });
        ws.addEventListener("error", (err) => {
            console.log(err);
        });
        ws.addEventListener("message", (message) => {
            const parsed = JSON.parse(message.data);
            if (parsed.type == 'welcome'){
                if (playerId == null){
                    playerId = parsed.player_id;
                    setInterval(()=>{
                        const y = Number(keysHeld['KeyS']) - Number(keysHeld['KeyW']);
                        const x = Number(keysHeld['KeyD']) - Number(keysHeld['KeyA']);
                        const movement = {x: x, y:y};
                        const inputMessage = {
                            player_id: playerId,
                            sequence_number: sequenceNumber,
                            client_timestamp: Date.now(),
                            movement: movement,
                            aim_angle: 0,
                            action: null
                        }
                        ws.send(JSON.stringify(inputMessage));
                        sequenceNumber++;
                    }, 33);
                }
            }
            else{
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                parsed.player_states.forEach((player_state) => {
                    
                    ctx.beginPath();

                    ctx.arc(player_state.position.x, player_state.position.y, 30, 0, 2 * Math.PI);

                    ctx.fillStyle = (player_state.connected && player_state.alive) ? player_state.player_id === playerId ? '#4da6ff' : '#CC0000': '#000000'; 
                    ctx.fill();
                });
            }
            console.log(parsed);
        });
                 
        
    </script>
</body>
</html>
