<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="canvas"></canvas>


    <script>
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        let myPosition = { x: 0, y: 0 };
        let mouseX = 0;
        let mouseY = 0;
        let aimAngle = 0;
        canvas.width = 1280;
        canvas.height = 720;
        let playerId = null;
        const maxDuration = 5;
        let sequenceNumber = 0;
        let isFiring = false;
        let shotsToRender = [];
        const ws = new WebSocket("ws://localhost:8080");
        const keysHeld = {
            'KeyS': false,
            'KeyW': false,
            'KeyA': false,
            'KeyD': false
        };
        
        document.addEventListener('keydown', (event) => {
            keysHeld[event.code] = true;
        });

        document.addEventListener('keyup', (event) => {
            keysHeld[event.code] = false;
        });

        document.addEventListener('mouseup', (event) => {
            isFiring = false;
        });
        document.addEventListener('mousedown', (event) => {
            isFiring = true;
        });
        canvas.addEventListener('mousemove', function(event) {
            const rect = canvas.getBoundingClientRect();
    
            mouseX = event.clientX - rect.left;
            mouseY = event.clientY - rect.top;
    
        });
        ws.addEventListener("open", () => {
            console.log("open");

        });
        ws.addEventListener("close", ()=> {
            console.log("close");
        });
        ws.addEventListener("error", (err) => {
            console.log(err);
        });
        ws.addEventListener("message", (message) => {
            const parsed = JSON.parse(message.data);
            if (parsed.type == 'welcome'){
                if (playerId == null){
                    playerId = parsed.player_id;
                    setInterval(()=>{
                        const y = Number(keysHeld['KeyS']) - Number(keysHeld['KeyW']);
                        const x = Number(keysHeld['KeyD']) - Number(keysHeld['KeyA']);
                        const movement = {x: x, y:y};
                        aimAngle = Math.atan2(mouseY - myPosition.y, mouseX - myPosition.x);
                        const inputMessage = {
                            player_id: playerId,
                            sequence_number: sequenceNumber,
                            client_timestamp: Date.now(),
                            movement: movement,
                            aim_angle: aimAngle, 
                            action: isFiring? 'fire' : null
                        }
                        ws.send(JSON.stringify(inputMessage));
                        sequenceNumber++;
                    }, 33);
                }
            }
            else if(parsed.type == 'server_tick'){
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                shotsToRender = shotsToRender.filter((shot) => {return parsed.tick_number - shot.tick_number < maxDuration});
                
                shotsToRender.forEach((shot)  => {
                
                    const opacity = 1 - ((parsed.tick_number - shot.tick_number) / maxDuration);
                    
                         
                    console.log(opacity, ctx.strokeStyle);
                    ctx.strokeStyle = "rgba(150,150,150," + opacity.toString() + ")";
                    ctx.beginPath();
                    ctx.moveTo(shot.start_point.x, shot.start_point.y);
                    ctx.lineTo(shot.end_point.x, shot.end_point.y);
                    ctx.lineWidth = 5;
                    
                    ctx.stroke();
                });
                parsed.player_states.forEach((player_state) => {
                    if(player_state.player_id === playerId){
                        myPosition = player_state.position;
    
                        const targetX = myPosition.x + 60 * Math.cos(aimAngle);
                        const targetY = myPosition.y + 60 * Math.sin(aimAngle);
                        ctx.lineWidth = 10;
                        ctx.strokeStyle = "red"; 
                        ctx.beginPath();
                        ctx.moveTo(myPosition.x, myPosition.y);
                        ctx.lineTo(targetX, targetY);
                        ctx.stroke();
                    }

                    ctx.beginPath();

                    ctx.arc(player_state.position.x, player_state.position.y, 30, 0, 2 * Math.PI);

                    ctx.fillStyle = (player_state.connected && player_state.alive) ? player_state.player_id === playerId ? '#4da6ff' : '#CC0000': '#000000'; 
                    ctx.fill();
                                    });
            }
            else if(parsed.type == 'shot_fired') {
                shotsToRender.push({
                    tick_number: parsed.tick_number,
                    end_point: parsed.end_point,
                    start_point: parsed.start_point,
                    shooter_id: parsed.shooter_id,
                    hit_player_id: parsed.hit_player_id
                });
            }
            else if(parsed.type == 'player_killed'){
                console.log(parsed.victim_id + " killed by " + parsed.killer_id);
            }
        });
                 
        
    </script>
</body>
</html>
