
services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_password
      POSTGRES_DB: game_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_user -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: game-server/Dockerfile
      target: builder
    command: npm run migrate --workspace=db
    environment:
      DATABASE_URL: postgres://game_user:game_password@postgres:5432/game_db
    depends_on:
      postgres:
        condition: service_healthy


  game-server:
    build:
      context: ..
      dockerfile: game-server/Dockerfile
    environment:
      DATABASE_URL: postgres://game_user:game_password@postgres:5432/game_db
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
